[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
mcp-core = { path = "../mcp-core" }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std"] }
